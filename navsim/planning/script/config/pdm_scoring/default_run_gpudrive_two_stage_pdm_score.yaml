hydra:
  run:
    dir: ${output_dir}
  output_subdir: ${output_dir}/code/hydra
  searchpath:
    - pkg://navsim.planning.script.config.common
  job:
    chdir: False

defaults:
  - default_common
  - default_evaluation
  - scorer: pdm_scorer
  - _self_
  - override train_test_split: navhard_two_stage

experiment_name: gpudrive_two_stage_pdm_score

stage_one_trajectory_dir: ???
stage_two_trajectory_dir: ???
evaluation_stage: all  # all, stage_one, or stage_two
strict_trajectory_files: true
show_progress: true

trajectory_sampling:
  _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
  _convert_: 'all'
  num_poses: 8
  interval_length: 0.5

simulator:
  _target_: navsim.planning.simulation.planner.pdm_planner.simulation.pdm_simulator.PDMSimulator
  _convert_: 'all'
  proposal_sampling: ${proposal_sampling}
